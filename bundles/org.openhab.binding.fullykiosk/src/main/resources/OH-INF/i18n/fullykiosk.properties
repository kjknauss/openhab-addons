# add-on

addon.fullykiosk.name = Fully Kiosk Browser Binding
addon.fullykiosk.description = This binding integrates Android devices running Fully Kiosk Browser through its Remote Admin REST interface.

# thing types

thing-type.fullykiosk.device.label = Fully Kiosk Device
thing-type.fullykiosk.device.description = An Android device running Fully Kiosk Browser with Remote Admin enabled

