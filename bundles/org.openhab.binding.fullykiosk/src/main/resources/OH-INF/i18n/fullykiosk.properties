thing-type.config.fullykiosk.device.hostname.label = Hostname
thing-type.config.fullykiosk.device.hostname.description = Hostname or IP address of the device
thing-type.config.fullykiosk.device.password.label = Remote Admin Password
thing-type.config.fullykiosk.device.password.description = Password set in the Fully Kiosk Remote Administration settings
