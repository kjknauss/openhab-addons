# add-on

addon.fullykiosk.name = Fully Kiosk Browser Binding
addon.fullykiosk.description = This binding integrates Android devices running Fully Kiosk Browser through its Remote Admin REST interface.

# thing types

thing-type.fullykiosk.device.label = Fully Kiosk Device
thing-type.fullykiosk.device.description = An Android device running Fully Kiosk Browser with Remote Admin enabled

# thing types config

thing-type.config.fullykiosk.device.hostname.label = Hostname
thing-type.config.fullykiosk.device.hostname.description = Hostname or IP address of the device
thing-type.config.fullykiosk.device.password.label = Remote Admin Password
thing-type.config.fullykiosk.device.password.description = Password set in the Fully Kiosk Remote Administration settings
thing-type.config.fullykiosk.device.port.label = Port
thing-type.config.fullykiosk.device.port.description = Port of the Fully Kiosk Remote Admin interface
thing-type.config.fullykiosk.device.refreshInterval.label = Refresh Interval
thing-type.config.fullykiosk.device.refreshInterval.description = Interval in seconds between polls of the device

# thing status descriptions

offline.configuration-error.hostname = Hostname must be configured.
offline.configuration-error.password = Remote Admin password must be configured.
offline.communication-error.unreachable = Device could not be reached.
offline.communication-error.http-status = Device returned HTTP status {0}.
offline.communication-error.invalid-response = Device returned an invalid response.
offline.communication-error.device-error = Device reported an error: {0}
